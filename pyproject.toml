[project]
name = "nexus-agent-os"
version = "0.1.0"
description = "Nexus — Agent Operating System: meta-orchestration for dynamic agent generation, deployment, and monitoring"
requires-python = ">=3.11"
dependencies = [
    "gradio>=4.0",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "mcp[cli]>=1.0",
    "python-dotenv>=1.0",
    "typing-extensions>=4.0",
]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]